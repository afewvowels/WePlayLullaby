[item-name]
wp-lullaby-equipment=Lullaby

[item-description]
wp-lullaby-equipment=A gramophone backpack that sings nearby enemies to sleep. Biters and spitters close by fall asleep, spitters further out are lured in, and worms are hushed. Sleepers wake in fits and starts and creep closer. One per equipment grid.

[equipment-name]
wp-lullaby-equipment=Lullaby

[equipment-description]
wp-lullaby-equipment=Sings nearby enemies to sleep while enemies are around. Runs on the grid's power, a little more for every enemy it holds. One per equipment grid.

[technology-name]
wp-lullaby-equipment=Lullaby

[technology-description]
wp-lullaby-equipment=Personal crowd control: a gramophone that plays a lullaby for you, over a carrier wave tuned for biters.

[mod-setting-name]
wp-lullaby-sound=Lullaby sounds
wp-lullaby-graphics=Lullaby visual effects
wp-lullaby-max-trance-seconds=Longest trance (seconds)
wp-lullaby-immunity-seconds=Immunity after waking (seconds)
wp-lullaby-worm-reentrance=Worms can be re-entranced
wp-lullaby-pulse-flash=Pulse brightening (%)
wp-lullaby-disable-cooldown=Disable effect cooldown (testing)

[mod-setting-description]
wp-lullaby-sound=Hear Lullaby's music, pulses and record scratch. Only affects you.
wp-lullaby-graphics=See Lullaby's rays, glow and night light. Only affects you; the effect still works with this off, and the swirls over entranced enemies always show.
wp-lullaby-max-trance-seconds=An entranced biter or spitter wakes up fully after this long, even if it hasn't reached you, so backing away slowly can't keep a crowd under forever. Scuttles don't reset it. They struggle harder as it runs out.
wp-lullaby-immunity-seconds=How long an enemy that has fully woken up (it reached you, you left it behind, or the song stopped) ignores the lullaby before it can be entranced again. 0 turns immunity off.
wp-lullaby-disable-cooldown=For testing: enemies can be entranced again as soon as they wake (no immunity), and worms can be hushed again. Turning it on clears all current immunities.
wp-lullaby-pulse-flash=How much the rays and glow brighten on each pulse (once a second, a soft swell). 0 turns it off for a steady glow.
wp-lullaby-worm-reentrance=Off: each worm can only be hushed once. On: worms can be hushed again, like biters and spitters, once their immunity runs out.

[wp-lullaby]
one-per-grid=Only one Lullaby fits in each equipment grid.
